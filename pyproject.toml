[project]
name = "link-content-scraper"
version = "0.2.0"
description = "Web scraper that fetches pages and converts them to markdown via Jina Reader API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "sentry-sdk[fastapi]>=2.0",
    "stripe>=15.0.1",
    "supabase>=2.28.3",
    "uvicorn>=0.34.0",
    # Floors for vulnerable transitive deps (#19): keep the lock from regressing.
    "starlette>=1.3.1",
    "h11>=0.16.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "aiohttp>=3.14.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
